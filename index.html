<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blossom AI 🌸</title>

  <style>
    :root {
      --pink: #ff80ab;
      --pink-dark: #ed5d94;
      --lavender: #f2eaff;
      --bg: #fff7fb;
      --text: #453344;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #ffe0ed 0, transparent 28%),
        radial-gradient(circle at 90% 90%, #e9dcff 0, transparent 30%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(850px, 94vh);
      min-height: 540px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #f6dce9;
      border-radius: 26px;
      box-shadow: 0 18px 60px #dca7c52c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: appear 0.5s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 18px 22px;
      background: linear-gradient(120deg, #ffe5ef, #f0e7ff);
      border-bottom: 1px solid #f6dce9;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 2px solid white;
      box-shadow: 0 3px 12px #d68eaf33;
    }

    .brand {
      flex: 1;
      min-width: 0;
    }

    .brand h1 {
      margin: 0 0 5px;
      font-size: 23px;
      color: #c94f88;
    }

    .brand p {
      margin: 0;
      font-size: 13px;
      color: #826b80;
    }

    .online {
      width: 9px;
      height: 9px;
      display: inline-block;
      background: #57c58a;
      border-radius: 50%;
      margin-right: 5px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 88%;
      animation: messageIn 0.22s ease;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #ffe3ef;
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot .bubble {
      background: #f5efff;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #ff91b8, #f17fac);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 22px 14px;
    }

    .suggestion {
      border: 1px solid #f1c9df;
      border-radius: 20px;
      background: #fff7fb;
      color: #b84d83;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.2s;
    }

    .suggestion:hover {
      background: #ffe5f0;
      transform: translateY(-2px);
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 16px;
      background: #f5efff;
      border-radius: 17px;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #c184ba;
      border-radius: 50%;
      animation: bounce 0.8s infinite alternate;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      to { transform: translateY(-5px); opacity: 0.5; }
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 15px 18px;
      background: white;
      border-top: 1px solid #f6e5ee;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 120px;
      border: 1px solid #efd6e5;
      outline: none;
      border-radius: 19px;
      padding: 13px 15px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: #fffafd;
    }

    #messageInput:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ff80ab20;
    }

    #sendButton {
      width: 47px;
      height: 47px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #ff8bb5, #e86da6);
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #sendButton:hover {
      transform: scale(1.07);
    }

    #sendButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      padding: 0 10px 13px;
      font-size: 11px;
      color: #a58a9e;
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .app {
        height: 100vh;
        min-height: 0;
