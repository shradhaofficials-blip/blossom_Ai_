
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blossom AI 🌸</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f6, #eee7ff);
      color: #392744;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .app {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      min-height: 450px;
      background: white;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 35px #9870a52b;
    }
    header {
      background: #f8e8ff;
      padding: 20px;
      text-align: center;
    }
    h1 { margin: 0 0 6px; color: #a14dbb; }
    header p { margin: 0; font-size: 14px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .bot { background: #f5edfa; align-self: flex-start; }
    .user {
      background: #ad60c5;
      color: white;
      align-self: flex-end;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee5f2;
    }
    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dfcce7;
      border-radius: 22px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      background: #a653c2;
      color: white;
      border: 0;
      border-radius: 22px;
      padding: 0 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    footer {
      text-align: center;
      color: #87788e;
      font-size: 11px;
      padding: 0 10px 10px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🌸 Blossom AI</h1>
      <p>Your witty, multilingual AI bestie 💜</p>
    </header>

    <section id="chat" aria-live="polite">
      <div class="bubble bot">
        Ohooo, finally! 😏 Welcome to Blossom.
        English, Hindi, Hinglish, Odia or Bhojpuri?
        Pick your drama, bestie. 🌸
      </div>
    </section>

    <form id="form">
      <input id="message" placeholder="Roast me, help me, anything..." maxlength="4000" required>
      <button id="send" type="submit">Send</button>
    </form>
    <footer>Blossom can make mistakes. Keep your passwords private.</footer>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addBubble(text, type) {
      const el = document.createElement("div");
      el.className = "bubble " + type;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addBubble(message, "user");
      input.value = "";
      send.disabled = true;
      const reply = addBubble("Blossom is thinking... 🌸", "bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        reply.textContent = data.reply || "Bestie, my brain just lagged. 😂";
      } catch {
        reply.textContent =
          "Oops! My brain cells aren't connected yet. We'll fix that soon! 🌷";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
