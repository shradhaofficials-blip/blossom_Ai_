
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blossom AI 🌸</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f6, #f2eaff);
      color: #382b3b; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 16px;
    }
    .app {
      width: 100%; max-width: 720px; height: 85vh; min-height: 480px;
      background: #ffffff; border-radius: 22px; overflow: hidden;
      box-shadow: 0 12px 40px #aa83b533;
      display: flex; flex-direction: column;
    }
    header {
      padding: 20px; background: #f9d9e8;
      display: flex; align-items: center; gap: 12px;
    }
    .flower { font-size: 34px; }
    h1 { margin: 0; font-size: 23px; }
    header p { margin: 5px 0 0; font-size: 13px; color: #725c70; }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .message {
      padding: 12px 15px; border-radius: 16px;
      max-width: 85%; white-space: pre-wrap; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .bot { background: #f7eaf8; align-self: flex-start; }
    .user { background: #dce9ff; align-self: flex-end; }
    .composer {
      display: flex; gap: 9px; padding: 15px;
      border-top: 1px solid #f0e7f0;
    }
    input {
      min-width: 0; flex: 1; border: 1px solid #e1d4e5;
      border-radius: 25px; padding: 13px 16px; font-size: 15px;
      outline-color: #d78bb7;
    }
    button {
      border: 0; border-radius: 25px; background: #d86ba4;
      color: white; font-weight: bold; padding: 0 20px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    footer { text-align: center; padding: 0 10px 12px; color: #917d91; font-size: 11px; }
    @media(max-width: 480px) {
      .app { height: 90vh; }
      header { padding: 15px; }
      #chat { padding: 14px; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="flower">🌸</div>
      <div>
        <h1>Blossom AI</h1>
        <p>Your witty, slightly chaotic AI bestie ✨</p>
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="message bot">Hey bestie! 🌸 I'm Blossom. English, Hindi, Hinglish, Odia, Bhojpuri—bring it on. What's happening in that brain of yours? 👀</div>
    </section>

    <form class="composer" id="form">
      <input id="message" placeholder="Say something, bestie..." autocomplete="off" required>
      <button id="send" type="submit">Send ➤</button>
    </form>
    <footer>Blossom AI · Be nice-ish 💗</footer>
  </main>

  <script>
    const API_URL = "https://blossom-ai-api.thebotblossom.workers.dev/api/chat";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        const reply = data.reply || "My brain cells took a coffee break. Try again?";
        addMessage(reply, "assistant");
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });
        if (history.length > 16) history.splice(0, history.length - 16);
      } catch (error) {
        addMessage("Oops! I couldn't reach my AI brain. " + error.message +
          " — this may be a connection setting we need to fix.", "assistant");
      } finally {
        send.disabled = false;
        send.textContent = "Send ➤";
        input.focus();
      }
    });
  </script>
</body>
</html>
