
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f7">
  <title>Blossom AI 🌸</title>

  <style>
    :root {
      --pink: #ff83b4;
      --pink-dark: #d94f8b;
      --lavender: #f1e8ff;
      --background: #fff7fb;
      --text: #493548;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 5% 10%, #ffe0ed, transparent 30%),
        radial-gradient(circle at 95% 90%, #e7dcff, transparent 32%),
        var(--background);
    }

    .app {
      width: min(780px, 100%);
      height: min(880px, 94vh);
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffffed;
      border: 1px solid #f5dce9;
      border-radius: 25px;
      box-shadow: 0 18px 65px #b777a31b;
      animation: enter .45s ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 17px 20px;
      background: linear-gradient(120deg, #ffe6f0, #efe7ff);
      border-bottom: 1px solid #f5dce9;
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 2px solid white;
    }

    .brand { flex: 1; min-width: 0; }

    .brand h1 {
      margin: 0 0 5px;
      color: #c64f89;
      font-size: 23px;
    }

    .brand p {
      margin: 0;
      color: #866f83;
      font-size: 12px;
    }

    .online {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
      background: #53c98b;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 90%;
      animation: appear .2s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #ffe4ef;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      background: #f3edff;
      border-bottom-left-radius: 5px;
    }

    .user .bubble {
      color: white;
      background: linear-gradient(135deg, #ff91bb, #e875a7);
      border-bottom-right-radius: 5px;
    }

    .bubble a {
      color: #a32e73;
      overflow-wrap: anywhere;
    }

    .user .bubble a { color: white; }

    .typing {
      display: flex;
      gap: 5px;
      width: fit-content;
      padding: 15px;
      background: #f3edff;
      border-radius: 16px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #bd84c2;
      animation: bounce .7s infinite alternate;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      to { opacity: .4; transform: translateY(-5px); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 13px;
    }

    .suggestion {
      padding: 9px 12px;
      border: 1px solid #f0c8df;
      border-radius: 20px;
      background: #fff7fb;
      color: #a94d7e;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .suggestion:hover {
      background: #ffe3ef;
      transform: translateY(-2px);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 13px;
      border-top: 1px solid #f4e1eb;
      background: white;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 120px;
      resize: none;
      padding: 13px 15px;
      border: 1px solid #ecd5e4;
      border-radius: 19px;
      outline: none;
      background: #fffafd;
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ff83b41a;
    }

    #sendButton {
      width: 47px;
      height: 47px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #ff91bb, #df65a1);
      font-size: 20px;
      cursor: pointer;
      transition: transform .2s;
    }

    #sendButton:hover { transform: scale(1.07); }
    #sendButton:disabled { opacity: .55; cursor: wait; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 10px;
      color: #a28a9e;
      font-size: 11px;
    }

    .sound-toggle {
      border: 0;
      background: transparent;
      color: #a34e80;
      cursor: pointer;
      font-size: 12px;
    }

    footer {
      padding: 0 8px 12px;
      text-align: center;
      color: #a58b9e;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .app { height: 100dvh; min-height: 0; border-radius: 0; }
      header { padding: 14px; }
      #chat { padding: 15px; }
      .suggestions { padding: 0 13px 12px; }
      .message { max-width: 95%; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <img
        class="logo"
        src="./blossom-logo.png"
        alt="Blossom logo"
        onerror="this.style.display='none'"
      >
      <div class="brand">
        <h1>Blossom AI 🌸</h1>
        <p><span class="online"></span>Your cute AI bestie is here</p>
      </div>
      <span aria-hidden="true">💗✨</span>
    </header>

    <section id="chat" aria-live="polite">
      <div class="message bot">
        <div class="avatar">🌸</div>
        <div class="bubble">Hiii bestie! 💗 I'm Blossom. Ask me anything—news, scores, coding, or just life drama. ✨</div>
      </div>
    </section>

    <div class="suggestions" id="suggestions">
      <button class="suggestion" data-message="What are the latest news headlines in India?">📰 Latest news</button>
      <button class="suggestion" data-message="Show me the latest cricket scores">🏏 Cricket scores</button>
      <button class="suggestion" data-message="Tell me something funny">😂 Make me laugh</button>
      <button class="suggestion" data-message="Aaj mera mood off hai">💗 Cheer me up</button>
      <button class="suggestion" data-message="ତୁମେ କେମିତି ଅଛ?">🌼 Odia chat</button>
    </div>

    <form class="composer" id="chatForm">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message Blossom... 💌"
        aria-label="Message Blossom"
        required
      ></textarea>
      <button id="sendButton" type="submit" aria-label="Send message">➤</button>
    </form>

    <div class="toolbar">
      <span>✨ English · Hindi · Hinglish · Odia</span>
      <button id="soundToggle" class="sound-toggle" type="button">🔊 Sounds on</button>
    </div>

    <footer>
      Made with 💗 and questionable levels of sass<br>
      by Shradha Subhadarshini 🌸
    </footer>
  </main>

  <script>
    const API_URL =
      "https://blossom-ai-api.thebotblossom.workers.dev/api/chat";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const suggestions = document.getElementById("suggestions");
    const soundToggle = document.getElementById("soundToggle");

    const messages = [];
    let isSending = false;
    let audioContext = null;
    let soundEnabled = true;

    // Multi-tone synthesized sounds: no audio files or extra API needed.
    function playSound(type) {
      if (!soundEnabled) return;

      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return;

        if (!audioContext) audioContext = new AudioClass();
        if (audioContext.state === "suspended") audioContext.resume();

        const now = audioContext.currentTime;

        const presets = {
          send: [
            { f: 660, end: 880, delay: 0, dur: 0.09, vol: 0.045 },
            { f: 880, end: 990, delay: 0.045, dur: 0.10, vol: 0.035 }
          ],
          receive: [
            { f: 523.25, end: 659.25, delay: 0, dur: 0.15, vol: 0.045 },
            { f: 659.25, end: 783.99, delay: 0.10, dur: 0.17, vol: 0.04 },
            { f: 783.99, end: 1046.5, delay: 0.20, dur: 0.22, vol: 0.035 }
          ],
          click: [
            { f: 820, end: 650, delay: 0, dur: 0.055, vol: 0.025 }
          ],
          error: [
            { f: 420, end: 310, delay: 0, dur: 0.16, vol: 0.04 },
            { f: 310, end: 230, delay: 0.13, dur: 0.20, vol: 0.035 }
          ]
        };

        const notes = presets[type] || presets.click;

        notes.forEach(note => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const start = now + note.delay;
          const end = start + note.dur;

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(note.f, start);
          oscillator.frequency.exponentialRampToValueAtTime(
            note.end, end
          );

          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(
            note.vol, start + 0.012
          );
          gain.gain.exponentialRampToValueAtTime(0.0001, end);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(start);
          oscillator.stop(end + 0.015);
        });
      } catch (error) {
        console.debug("Sound unavailable:", error);
      }
    }

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled
        ? "🔊 Sounds on"
        : "🔇 Sounds off";

      if (soundEnabled) playSound("click");
    });

    function addMessage(text, sender) {
      const row = document.createElement("div");
      row.className = "message " + sender;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = sender === "bot" ? "🌸" : "💗";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      // Turn ordinary URLs into clickable links safely.
      const urlPattern = /(https?:\/\/[^\s]+)/g;
      const parts = text.split(urlPattern);

      bubble.textContent = "";

      parts.forEach(part => {
        if (/^https?:\/\/[^\s]+$/.test(part)) {
          const link = document.createElement("a");
          link.href = part;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = part;
          bubble.appendChild(link);
        } else {
          bubble.appendChild(document.createTextNode(part));
        }
      });

      row.append(avatar, bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;

      return row;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "message bot";
      row.id = "typingIndicator";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🌸";

      const dots = document.createElement("div");
      dots.className = "typing";

      for (let i = 0; i < 3; i++) {
        dots.appendChild(document.createElement("span"));
      }

      row.append(avatar, dots);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      document.getElementById("typingIndicator")?.remove();
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text || isSending) return;

      isSending = true;
      sendButton.disabled = true;
      input.disabled = true;
      suggestions.style.display = "none";

      addMessage(text, "user");
      playSound("send");

      messages.push({ role: "user", content: text });
      showTyping();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            messages: messages.slice(-20)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Please try again.");
        }

        if (!data.reply || typeof data.reply !== "string") {
          throw new Error("Blossom returned an empty reply.");
        }

        hideTyping();
        addMessage(data.reply, "bot");
        playSound("receive");

        messages.push({ role: "assistant", content: data.reply });

        if (messages.length > 20) {
          messages.splice(0, messages.length - 20);
        }
      } catch (error) {
        hideTyping();
        addMessage(
          "Oops bestie! 🥺 I couldn't connect right now.\n\n" +
          error.message +
          "\n\nCheck your connection and try again. 💗",
          "bot"
        );
        playSound("error");
        console.error("Blossom error:", error);
      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value;
      if (!text.trim()) return;

      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    suggestions.addEventListener("click", event => {
      const button = event.target.closest("[data-message]");
      if (!button) return;

      playSound("click");
      sendMessage(button.dataset.message);
    });
  </script>
</body>
</html>
